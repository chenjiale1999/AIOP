paths:
  # Optional: leave empty to autodetect a sibling ``tilelang`` checkout,
  # an installed A5 tilelang package, or a path from AIOP_TILELANG_REPO.
  tilelang_repo: ""
  # Project-relative defaults (resolved against the repository root):
  # workspace / knowledge / samples / reports are omitted on purpose.
  tileops_manifest: ""

cann:
  # Optional: leave empty to autodetect ASCEND_HOME_PATH / ASCEND_TOOLKIT_HOME
  # or /usr/local/Ascend/{ascend-toolkit/latest,cann-*}.
  # A5 (dav-3510) headers/instructions require CANN 9.2.
  home: ""
  npusim: ""
  soc_version: Ascend950

compile:
  target: ascend
  npu_arch: dav-3510
  device_flags:
    - -D__INTEL_LLVM_COMPILER=1
    - -DSYCL_LANGUAGE_VERSION=1
  timeout_s: 1600

simulation:
  backend: auto
  timeout_s: 1800
  repeats: 20
  warmup: 5

# Independent execution switches. Disabled stages are skipped without
# changing any business code; unsupported environments are skipped as well.
steps:
  compile: true
  simulate: true
  npu: true        # direct NPU / board execution
  profile: true    # pipeline profiling after precision passes

logging:
  # off | error | warn | info | debug
  command_level: info
  # Echo full command lines to stderr in addition to commands.log
  echo_commands: false

# Dual-baseline alignment: CUDA peer for semantics, verified Ascend A5 kernel
# for structure/hardware adaptation. Leave tileops_repo empty to autodetect
# ref_reops/TileOPs, a sibling checkout or AIOP_TILEOPS_REPO.
references:
  tileops_repo: ""
  enabled: true
  require_cuda: true          # manifest ops must have a CUDA peer
  require_ascend: true        # at least a verified A5 style baseline
  max_chars: 40000            # per-reference prompt budget (full file path still recorded)
  parity_atol: 1.0e-05        # fp32 parity gate against the CUDA semantics
  enforce_parity: true
  integration_required: true  # open/LLM kernels must be TileOPs-registrable

board:
  host: ""
  port: 22
  key: ""
  remote_dir: /tmp/aiop_runs
  python: python3
  env_script: ""
  tilelang_repo: ""
  # Optional: run a profiling command after the measurement, e.g.
  #   npu-smi info -t usages
  #   msprof --output=./profile --application="python test_op.py"
  profile_cmd: ""
  timeout_s: 1800
  repeats: 50
  warmup: 10

agent:
  max_attempts: 3
  max_sim_attempts: 2
  # LLM is optional. When enabled it is used for:
  #   * operators whose family has no A5 template (open-ended mode), and
  #   * repairing a draft after static / device-compile failures.
  # Families that already have a verified template keep using it unless
  # --strategy llm is passed explicitly.
  # Any OpenAI-compatible endpoint works, e.g. DeepSeek:
  #   base_url: https://api.deepseek.com/v1
  #   model: <provider model id>
  #   export AIOP_LLM_API_KEY=...
  llm:
    enabled: false
    base_url: ""
    model: ""
    api_key_env: AIOP_LLM_API_KEY
    timeout_s: 120000
