{
  "name": "rmsnorm",
  "family": "rmsnorm",
  "formula": "y = x / sqrt(mean(x^2) + eps) * w",
  "inputs": [
    {
      "name": "X",
      "shape": [
        128,
        4096
      ],
      "dtype": "float32"
    },
    {
      "name": "W",
      "shape": [
        4096
      ],
      "dtype": "float32"
    }
  ],
  "outputs": [
    {
      "name": "Y",
      "shape": [
        128,
        4096
      ],
      "dtype": "float32"
    }
  ],
  "precision": {
    "atol": 1e-05,
    "rtol": 1e-05,
    "max_abs_error": 0.0001,
    "matched_ratio": 0.9999
  },
  "perf": {
    "metric": "latency",
    "target": null,
    "unit": "ms"
  },
  "attrs": {
    "eps": 1e-06
  },
  "notes": "",
  "version": "1"
}