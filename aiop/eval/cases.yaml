# Operator benchmark suite for the A5 agent.
# Each case is a TaskSpec. Shapes deliberately include tails, primes and
# non-power-of-two rows to exercise guards and capacity planning.
cases:
  - name: relu
    family: elementwise_unary
    inputs: [{name: X, shape: [128, 1000], dtype: float32}]
    outputs: [{name: Y, shape: [128, 1000], dtype: float32}]
  - name: abs
    family: elementwise_unary
    inputs: [{name: X, shape: [1024, 4096], dtype: bfloat16}]
    outputs: [{name: Y, shape: [1024, 4096], dtype: bfloat16}]
  - name: exp
    family: elementwise_unary
    inputs: [{name: X, shape: [4096, 2048], dtype: float16}]
    outputs: [{name: Y, shape: [4096, 2048], dtype: float16}]
  - name: neg
    family: elementwise_unary
    inputs: [{name: X, shape: [1000003], dtype: float32}]
    outputs: [{name: Y, shape: [1000003], dtype: float32}]
  - name: sigmoid
    family: elementwise_unary
    inputs: [{name: X, shape: [128, 1000], dtype: bfloat16}]
    outputs: [{name: Y, shape: [128, 1000], dtype: bfloat16}]
  - name: tanh
    family: elementwise_unary
    inputs: [{name: X, shape: [257, 1000], dtype: float32}]
    outputs: [{name: Y, shape: [257, 1000], dtype: float32}]
  - name: cast
    family: elementwise_unary
    inputs: [{name: X, shape: [512, 1000], dtype: float16}]
    outputs: [{name: Y, shape: [512, 1000], dtype: float32}]

  - name: add
    family: elementwise_binary
    inputs: [{name: A, shape: [1000003], dtype: float32}, {name: B, shape: [1000003], dtype: float32}]
    outputs: [{name: C, shape: [1000003], dtype: float32}]
  - name: mul
    family: elementwise_binary
    inputs: [{name: A, shape: [1048576], dtype: bfloat16}, {name: B, shape: [1048576], dtype: bfloat16}]
    outputs: [{name: C, shape: [1048576], dtype: bfloat16}]
  - name: div
    family: elementwise_binary
    inputs: [{name: A, shape: [512, 1000], dtype: float32}, {name: B, shape: [512, 1000], dtype: float32}]
    outputs: [{name: C, shape: [512, 1000], dtype: float32}]
  - name: maximum
    family: elementwise_binary
    inputs: [{name: A, shape: [1000, 1000], dtype: float32}, {name: B, shape: [1000, 1000], dtype: float32}]
    outputs: [{name: C, shape: [1000, 1000], dtype: float32}]
  - name: sub
    family: elementwise_binary
    inputs: [{name: A, shape: [2048, 2048], dtype: float16}, {name: B, shape: [2048, 2048], dtype: float16}]
    outputs: [{name: C, shape: [2048, 2048], dtype: float16}]

  - name: reduce_sum
    family: row_reduce
    inputs: [{name: X, shape: [128, 1000], dtype: float32}]
    outputs: [{name: Y, shape: [128], dtype: float32}]
  - name: reduce_max
    family: row_reduce
    inputs: [{name: X, shape: [100, 4096], dtype: bfloat16}]
    outputs: [{name: Y, shape: [100], dtype: bfloat16}]
  - name: reduce_min
    family: row_reduce
    inputs: [{name: X, shape: [64, 777], dtype: float32}]
    outputs: [{name: Y, shape: [64], dtype: float32}]
  - name: reduce_mean
    family: row_reduce
    inputs: [{name: X, shape: [512, 1024], dtype: float16}]
    outputs: [{name: Y, shape: [512], dtype: float16}]

  - name: softmax
    family: softmax
    inputs: [{name: X, shape: [128, 1000], dtype: float32}]
    outputs: [{name: Y, shape: [128, 1000], dtype: float32}]
  - name: softmax
    family: softmax
    inputs: [{name: X, shape: [256, 4096], dtype: bfloat16}]
    outputs: [{name: Y, shape: [256, 4096], dtype: bfloat16}]
    notes: bf16 large-row softmax
  - name: softmax
    family: softmax
    inputs: [{name: X, shape: [100, 777], dtype: float16}]
    outputs: [{name: Y, shape: [100, 777], dtype: float16}]
    notes: odd row length + partial batch

  - name: rmsnorm
    family: rmsnorm
    inputs: [{name: X, shape: [128, 4096], dtype: float32}, {name: W, shape: [4096], dtype: float32}]
    outputs: [{name: Y, shape: [128, 4096], dtype: float32}]
  - name: rmsnorm
    family: rmsnorm
    inputs: [{name: X, shape: [256, 1000], dtype: bfloat16}, {name: W, shape: [1000], dtype: bfloat16}]
    outputs: [{name: Y, shape: [256, 1000], dtype: bfloat16}]
  - name: rmsnorm
    family: rmsnorm
    inputs: [{name: X, shape: [64, 2048], dtype: float16}, {name: W, shape: [2048], dtype: float16}]
    outputs: [{name: Y, shape: [64, 2048], dtype: float16}]

  - name: layernorm
    family: layernorm
    inputs: [{name: X, shape: [128, 1000], dtype: float32}, {name: W, shape: [1000], dtype: float32}, {name: B, shape: [1000], dtype: float32}]
    outputs: [{name: Y, shape: [128, 1000], dtype: float32}]
  - name: layernorm
    family: layernorm
    inputs: [{name: X, shape: [256, 4096], dtype: bfloat16}, {name: W, shape: [4096], dtype: bfloat16}]
    outputs: [{name: Y, shape: [256, 4096], dtype: bfloat16}]

  - name: gemm
    family: gemm
    inputs: [{name: A, shape: [256, 256], dtype: bfloat16}, {name: B, shape: [448, 256], dtype: bfloat16}]
    outputs: [{name: C, shape: [256, 448], dtype: float32}]
  - name: gemm
    family: gemm
    inputs: [{name: A, shape: [512, 512], dtype: bfloat16}, {name: B, shape: [1024, 512], dtype: bfloat16}]
    outputs: [{name: C, shape: [512, 1024], dtype: float32}]
  - name: gemm_relu
    family: gemm
    inputs: [{name: A, shape: [256, 128], dtype: bfloat16}, {name: B, shape: [224, 128], dtype: bfloat16}]
    outputs: [{name: C, shape: [256, 224], dtype: float32}]
  - name: gemm
    family: gemm
    inputs: [{name: A, shape: [128, 256], dtype: float16}, {name: B, shape: [256, 256], dtype: float16}]
    outputs: [{name: C, shape: [128, 256], dtype: float32}]

  # ---- TileOPs manifest entries (src/tileops/manifest/spec/*.yaml) ----
  # Same pipeline, but the contract is bound from the manifest instead of a
  # hand-written TaskSpec. `workload` is a row index (or a row `label`) and
  # `dtype_case` indexes that row's `dtype_cases`.
  - {op: ReluFwdOp, workload: 0, dtype_case: 0}
  - {op: SigmoidFwdOp, workload: 0, dtype_case: 0}
  - {op: AddFwdOp, workload: 0, dtype_case: 0}
  - {op: SumFwdOp, workload: 0, dtype_case: 0}
  - {op: SoftmaxFwdOp, workload: 0, dtype_case: 0}
  - {op: RMSNormFwdOp, workload: 0, dtype_case: 1}
  - {op: LayerNormFwdOp, workload: 0, dtype_case: 0}
  - {op: GemmFwdOp, workload: 1, dtype_case: 0}
